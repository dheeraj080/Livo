services:
  # ============================================================================
  # Livo Next.js Modular Monolith Application
  # ============================================================================
  Livo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Livo_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-Livo}:${POSTGRES_PASSWORD:-Livo_password}@postgres:5432/${POSTGRES_DB:-Livo}
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - ELASTICSEARCH_API_KEY=${ELASTICSEARCH_API_KEY:-}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-Livo}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-Livo_secret_key}
      - S3_BUCKET=${S3_BUCKET:-Livo-attachments}
      - S3_FORCE_PATH_STYLE=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - Livo_network

  # ============================================================================
  # PostgreSQL (Primary Relational Database)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: Livo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Livo}
      POSTGRES_USER: ${POSTGRES_USER:-Livo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Livo_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-Livo} -d $${POSTGRES_DB:-Livo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - Livo_network

  # ============================================================================
  # Redis (BullMQ Queues & Background Job Coordination)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: Livo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - Livo_network

  # ============================================================================
  # Elasticsearch (Full-Text Search & Dense Vector Embeddings)
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    container_name: Livo_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - Livo_network

  # ============================================================================
  # MinIO (S3-Compatible Object Storage for Document Attachments)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: Livo_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-Livo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Livo_secret_key}
    volumes:
      - minio_data:/data
    ports:
      # Expose MinIO Web Console only for admin review; S3 API (9000) remains private
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - Livo_network

  # ============================================================================
  # MinIO Bucket Auto-Provisioner (Idempotent Initialization)
  # ============================================================================
  minio-create-bucket:
    image: minio/mc:latest
    container_name: Livo_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set Livominio http://minio:9000 $${MINIO_ROOT_USER:-Livo} $${MINIO_ROOT_PASSWORD:-Livo_secret_key};
      /usr/bin/mc mb --ignore-existing Livominio/$${S3_BUCKET:-Livo-attachments};
      exit 0;
      "
    networks:
      - Livo_network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: Livo_postgres_data
  redis_data:
    name: Livo_redis_data
  elasticsearch_data:
    name: Livo_elasticsearch_data
  minio_data:
    name: Livo_minio_data

# ==============================================================================
# Private Isolated Network
# ==============================================================================
networks:
  Livo_network:
    name: Livo_network
    driver: bridge
